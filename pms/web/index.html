<!doctype html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3d3df5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JOVIAN"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>JOVIAN · PMS</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workspace.css"></head>
<body class="auth-pending"><aside id="workspace-sidebar"><button id="collapse-navigation"><span data-t="collapseNavigation"></span><span aria-hidden="true">«</span></button><nav id="nav" aria-label="Section"></nav></aside>
<main><header class="workspace-header"><a class="header-brand" href="#" aria-label="JOVIAN Home"><span class="brand-mark">J</span></a><div class="property-switch"><select id="property" aria-label="Property"></select><button id="choose-property" aria-label="Choose hotel">⌄</button></div><details id="workspace-options" class="workspace-options"><summary data-t="test"></summary><div class="workspace-options-panel"><div class="notice"><strong data-t="test"></strong><span data-t="notice"></span></div><section class="topline"><div><label for="date" data-t="date"></label><input id="date" type="date" value="2027-01-10" aria-label="Business date"></div></section><span id="session-label"></span><button id="logout" hidden data-t="logout"></button></div></details><h1 id="title" class="sr-only"></h1><nav id="global-nav" aria-label="Main"></nav><div class="tools"><button id="install-app" hidden class="icon-button" data-ui-icon="grid"><span class="sr-only">Install app</span></button><button id="guest-messages" class="icon-button" data-ui-icon="message"><span class="sr-only" data-t="guestMessages"></span></button><button id="self-checkin" class="icon-button" data-ui-icon="lock"><span class="sr-only" data-t="selfCheckin"></span></button><button id="technical-support" class="icon-button" data-ui-icon="headset"><span class="sr-only" data-t="technicalSupport"></span></button><button id="help-center" class="icon-button" data-ui-icon="help"><span class="sr-only" data-t="helpCenter"></span></button><button id="refresh" hidden class="icon-button" data-ui-icon="refresh"><span class="sr-only">Refresh</span></button><label class="language-picker"><span data-ui-icon="globe"></span><select id="language" aria-label="Language"><option value="zh">中文</option><option value="en">English</option><option value="ms">Bahasa Melayu</option></select></label><span class="header-wordmark">JOVIAN<small>HOME</small></span></div></header>
<button id="new" class="primary floating-new"><span class="sr-only" data-t="new"></span><span aria-hidden="true">＋</span></button>
<div id="message" role="status" aria-live="polite"></div><div id="content"></div>
<footer><span>JOVIAN PMS · 0.10 · SHARED DEVELOPMENT</span><span data-t="footer"></span></footer></main>
<dialog id="property-dialog"><h2 id="property-picker-title"></h2><p id="property-picker-note"></p><div id="property-cards"></div></dialog>
<dialog id="order-dialog"><form id="order-form"><div class="dialog-head"><h2 data-t="new"></h2><button type="button" id="close" aria-label="Close">×</button></div><label><span data-t="guest"></span><input name="guest" required maxlength="100" autocomplete="off"></label><div class="form-row"><label><span data-t="product"></span><select name="productId" id="product"></select></label><label><span data-t="gender"></span><select name="gender" id="gender"></select></label></div><div class="form-row"><label><span data-t="arrival"></span><input name="start" type="date" required></label><label><span data-t="departure"></span><input name="end" type="date" required></label></div><label><span data-t="group"></span><input name="group" maxlength="60"></label><p class="muted" data-t="single"></p><p id="form-error" role="alert"></p><button class="primary" data-t="save"></button></form></dialog>
<dialog id="utility-dialog"><div class="dialog-head"><h2 id="utility-title"></h2><button id="utility-close" aria-label="Close">×</button></div><div id="utility-body"></div><p id="utility-error" role="alert"></p></dialog>
<dialog id="detail-dialog"><div id="detail-body"></div></dialog>
<dialog id="login-dialog"><form id="login-form"><select id="login-language" aria-label="Language"><option value="zh">中文</option><option value="en">English</option><option value="ms">Bahasa Melayu</option></select><h2 data-t="login">登录 JOVIAN</h2><p class="muted">JOVIAN PMS · DEVELOPMENT / TEST</p><label><span data-t="username">账号</span><input name="username" autocomplete="username" required maxlength="64"></label><label><span data-t="password">密码</span><input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><p id="login-error" role="alert"></p><button class="primary" data-t="loginButton">登录</button></form></dialog>
<script type="module" src="pwa.js"></script>
<script type="module" src="app.js"></script></body></html>
