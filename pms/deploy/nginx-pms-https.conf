# Install only after certificate paths below exist for this exact hostname.
server {
    listen 80;
    listen [::]:80;
    server_name pms.jovianhome.com;
    location /.well-known/acme-challenge/ {
        root /var/lib/jovian-pms-acme;
    }
    location / {
        return 308 https://pms.jovianhome.com$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name pms.jovianhome.com;
    ssl_certificate /etc/letsencrypt/live/pms.jovianhome.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pms.jovianhome.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    location / {
        proxy_pass http://127.0.0.1:18010;
        proxy_set_header Host pms.jovianhome.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
