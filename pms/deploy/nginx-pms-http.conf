# Initial independent HTTP site, pending a dedicated certificate for PMS.
# Check nginx -T for existing pms.jovianhome.com server_name first.
# Never replace /etc/nginx/sites-enabled/cohub or its certificate.
server {
    listen 80;
    listen [::]:80;
    server_name pms.jovianhome.com;
    location / {
        # The application is configured for HTTPS and will reject HTTP writes.
        return 503;
    }
    location /.well-known/acme-challenge/ {
        root /var/lib/jovian-pms-acme;
    }
}
